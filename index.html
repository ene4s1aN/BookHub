<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookHub 2.0</title>

<style>
:root{
  --cream:#fff5d7;
  --cream-light:#fffdf7;
  --pink:#ff6fa8;
  --pink-soft:#ffe5ef;
  --pink-border:#ffd0e2;
  --text:#2f2f35;
  --muted:#777;
  --shadow:0 18px 45px rgba(255,111,168,.16);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.wrapper{
  max-width:1600px;
  margin:0 auto;
  padding:28px 32px 34px;
}
.header{
  display:grid;
  grid-template-columns:220px minmax(520px,1fr) 300px 170px;
  gap:34px;
  align-items:center;
  margin-bottom:30px;
}
.logo{display:flex;align-items:center;gap:12px;color:var(--pink)}
.logo-icon{font-size:40px}
.logo h1{margin:0;font-size:34px;font-family:Georgia,serif;font-style:italic}
.logo p{margin:3px 0 0;color:#6c6262;font-size:13px}
.tabs{
  background:rgba(255,255,255,.75);
  border:1px solid var(--pink-border);
  box-shadow:var(--shadow);
  border-radius:22px;
  padding:8px;
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  margin-left:24px;
}
.tab{border:0;background:transparent;padding:13px 18px;border-radius:16px;font-weight:900;color:#222;cursor:pointer}
.tab.active{background:var(--pink-soft);color:var(--pink)}
.search{position:relative}
.search input{
  width:100%;
  border:1px solid var(--pink-border);
  background:white;
  box-shadow:var(--shadow);
  padding:18px 52px 18px 22px;
  border-radius:24px;
  outline:none;
  font-size:15px;
}
.search span{position:absolute;right:19px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--pink)}
.view-toggle{
  border:1px solid var(--pink-border);
  background:white;
  color:var(--pink);
  box-shadow:var(--shadow);
  padding:16px 18px;
  border-radius:24px;
  outline:none;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  transition:.18s ease;
  white-space:nowrap;
}
.view-toggle:hover{background:var(--pink-soft);transform:translateY(-2px)}
.book-panel{
  background:transparent;
  border:0;
  box-shadow:none;
  border-radius:0;
  padding:0;
  margin-bottom:28px;
}
.book-title{
  margin:0 0 10px;
  color:var(--pink);
  font-family:Georgia,serif;
  font-size:24px;
  font-style:italic;
}
.add-panel{
  background:rgba(255,255,255,.76);
  border:1px solid var(--pink-border);
  box-shadow:var(--shadow);
  border-radius:24px;
  padding:14px;
  display:grid;
  grid-template-columns:1.1fr 1fr .8fr .75fr .8fr auto;
  gap:10px;
}
.add-panel input,.add-panel select{
  border:1px solid var(--pink-border);
  background:white;
  border-radius:16px;
  padding:14px;
  outline:none;
  min-width:0;
}
.add-panel button,
.books-search-row button{
  border:0;
  background:var(--pink);
  color:white;
  border-radius:16px;
  padding:0 24px;
  font-weight:900;
  cursor:pointer;
}
.books-search-row{
  background:rgba(255,255,255,.76);
  border:1px solid var(--pink-border);
  box-shadow:var(--shadow);
  border-radius:24px;
  padding:14px;
  display:grid;
  grid-template-columns:1.2fr .9fr auto;
  gap:10px;
}
.books-search-row input,
.books-search-row select{
  border:1px solid var(--pink-border);
  background:white;
  border-radius:16px;
  padding:14px;
  outline:none;
}
.book-results{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
  gap:14px;
  margin-top:16px;
}
.book-result{
  border:1px solid var(--pink-border);
  background:white;
  border-radius:16px;
  padding:9px;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(255,111,168,.10);
  transition:.18s ease;
}
.book-result:hover{transform:translateY(-4px)}
.book-result img,
.book-result .no-cover{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:12px;
  background:linear-gradient(135deg,#ffecf4,#fff);
  display:grid;
  place-items:center;
  color:var(--pink);
  font-weight:900;
  text-align:center;
}
.book-result b{display:block;margin-top:8px;font-size:13px;line-height:1.15}
.book-result small{display:block;margin-top:4px;color:var(--muted)}
.book-result-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.result-chip{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:var(--pink-soft);color:var(--pink)}
.search-fallback{grid-column:1/-1;background:white;border:1px dashed var(--pink);border-radius:18px;padding:18px;text-align:center;color:var(--muted)}
.search-fallback button{margin-top:10px;border:0;background:var(--pink);color:white;border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}
.loading{
  grid-column:1/-1;
  text-align:center;
  background:white;
  border:1px solid var(--pink-border);
  border-radius:18px;
  padding:18px;
  color:var(--muted);
  font-weight:800;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{
  position:relative;
  height:300px;
  border-radius:18px;
  overflow:hidden;
  background:#111;
  box-shadow:0 16px 35px rgba(0,0,0,.14);
  transition:.22s ease;
}
.card:hover{transform:translateY(-6px)}
.cover,.placeholder{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.placeholder{
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ffecf4,#fff);
  color:var(--pink);
  font-family:Georgia,serif;
  font-size:20px;
  font-weight:900;
  text-align:center;
  padding:12px;
}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.82) 100%);pointer-events:none}
.info{position:absolute;left:22px;right:22px;bottom:22px;z-index:4;color:white}
.info h2{margin:0 0 6px;font-size:20px;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.75)}
.info p{margin:0;font-size:13px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.75);opacity:.92}
.progress-badge{
  position:absolute;
  top:16px;
  left:16px;
  z-index:5;
  border:0;
  background:rgba(255,255,255,.95);
  color:#222;
  border-radius:999px;
  padding:9px 13px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
  font-size:13px;
}
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:100;
}
.modal-overlay.open{display:flex}
.modal{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--cream-light);
  border:1px solid var(--pink-border);
  border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.28);
  padding:20px;
  position:relative;
}
.modal-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:var(--pink-soft);color:var(--pink);font-size:24px;font-weight:900;cursor:pointer}
.modal-content{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.modal-cover,.modal-placeholder{width:100%;aspect-ratio:2/3;border-radius:22px;background:linear-gradient(135deg,#ffecf4,#fff);box-shadow:0 18px 35px rgba(255,111,168,.16)}
.modal-cover{object-fit:cover}
.modal-placeholder{color:var(--pink);display:grid;place-items:center;font-family:Georgia,serif;font-weight:900;font-size:26px;text-align:center;padding:12px}
.modal-title{margin:8px 48px 6px 0;color:var(--pink);font-family:Georgia,serif;font-size:34px;font-style:italic;line-height:1.05}
.modal-author{margin:0 0 12px;color:#6c6262;font-weight:800}
.modal-label{display:block;margin:16px 0 8px;color:#5e5555;font-weight:900}
.modal-stars{display:flex;gap:4px;font-size:34px}
.modal-stars button{border:0;background:transparent;color:var(--pink);font-size:34px;padding:0;cursor:pointer;transition:.15s ease}
.modal-stars button:hover{transform:scale(1.12)}
.progress-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress-row input{width:100%;border:1px solid var(--pink-border);border-radius:16px;padding:13px;outline:none;background:white}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--pink-border);border-radius:18px;padding:14px;outline:none;resize:vertical;font-family:Arial,sans-serif;font-size:15px;background:white}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.modal-actions button,.modal-actions select{border:1px solid var(--pink-border);background:white;border-radius:999px;padding:12px 16px;font-weight:900;cursor:pointer}
.modal-actions button{color:var(--pink)}
.modal-actions .modal-delete{background:var(--pink-soft);color:var(--pink)}
.modal-actions select{color:#2f2f35;outline:none}
.modal-hint{margin-top:12px;color:var(--muted);font-size:13px}
.stats{
  margin-top:28px;
  background:rgba(255,255,255,.72);
  border:1px solid var(--pink-border);
  box-shadow:var(--shadow);
  border-radius:22px;
  padding:18px 24px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}
.stat{display:flex;align-items:center;gap:14px;justify-content:center;border-right:1px solid var(--pink-border)}
.stat:last-child{border-right:0}
.stat .icon{font-size:34px;color:var(--pink)}
.stat small{display:block;color:#555;font-weight:800}
.stat b{font-size:26px}
.empty{grid-column:1/-1;text-align:center;background:white;border:1px solid var(--pink-border);border-radius:22px;padding:50px;color:var(--muted)}
.grid.view-large{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid.view-large .card{height:300px}
.grid.view-medium{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.grid.view-medium .card{height:245px}
.grid.view-medium .info{left:18px;right:18px;bottom:18px}
.grid.view-medium .info h2{font-size:18px}
.grid.view-compact{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:14px}
.grid.view-compact .card{height:200px;border-radius:15px}
.grid.view-compact .info{left:13px;right:13px;bottom:13px}
.grid.view-compact .info h2{font-size:15px;line-height:1.05;margin-bottom:0}
.grid.view-compact .info p,.grid.view-compact .progress-badge{font-size:11px}
.watermark{text-align:center;margin:30px 0 10px;color:#9b8b8b;font-size:14px;font-style:italic;opacity:.8;letter-spacing:.5px}
.watermark span{color:var(--pink);font-weight:700}
@media(max-width:1100px){
  .header{grid-template-columns:1fr}
  .tabs{margin-left:0}
  .grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{border-right:0}
  .add-panel{grid-template-columns:1fr 1fr}
}
@media(max-width:750px){
  .modal-content{grid-template-columns:1fr}
  .modal-cover,.modal-placeholder{max-width:260px;margin:0 auto}
  .modal-title{font-size:28px}
}
@media(max-width:650px){
  .wrapper{padding:18px}
  .grid{grid-template-columns:1fr}
  .card{height:420px}
  .add-panel,.books-search-row{grid-template-columns:1fr}
  .tabs{justify-content:flex-start}
  .tab{padding:11px 13px}
  .view-toggle{width:100%}
  .grid.view-large{grid-template-columns:1fr}
  .grid.view-large .card{height:420px}
  .grid.view-medium{grid-template-columns:repeat(2,1fr)}
  .grid.view-medium .card{height:260px}
  .grid.view-compact{grid-template-columns:repeat(3,1fr);gap:10px}
  .grid.view-compact .card{height:185px}
  .grid.view-compact .info{left:9px;right:9px;bottom:9px}
  .grid.view-compact .info h2{font-size:12px}
  .grid.view-compact .info p{display:none}
}
</style>
</head>

<body>
<div class="wrapper">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <h1>BookHub 2.0 ♡</h1>
        <p>Books & Reading Tracker ✨</p>
      </div>
    </div>

    <nav class="tabs" id="tabs"></nav>

    <div class="search">
      <input id="search" placeholder="Suche nach Büchern oder Autoren...">
      <span>⌕</span>
    </div>

    <button class="view-toggle" id="viewToggle" type="button">📖 Große Cover</button>
  </header>

  <section class="book-panel">
    <h2 class="book-title">Manuell hinzufügen ✨</h2>
    <section class="add-panel">
      <input id="title" placeholder="Buchtitel">
      <input id="author" placeholder="Autor/in">
      <input id="pages" type="number" min="0" placeholder="Seiten">
      <input id="cover" type="file" accept="image/*">
      <select id="status">
        <option>Want to Read</option>
        <option>Reading</option>
        <option>Read</option>
        <option>On Hold</option>
        <option>Dropped</option>
      </select>
      <button id="addBtn">Hinzufügen</button>
    </section>
  </section>

  <section class="book-panel">
    <h2 class="book-title">Online Buchsuche ✨</h2>
    <div class="books-search-row">
      <input id="bookQuery" placeholder="Tippe einen Buchtitel oder Autor ein...">
      <select id="bookStatus">
        <option>Want to Read</option>
        <option>Reading</option>
        <option>Read</option>
        <option>On Hold</option>
        <option>Dropped</option>
      </select>
      <button id="bookSearchBtn" type="button">Suchen</button>
    </div>
    <div class="book-results" id="bookResults"></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer class="stats">
    <div class="stat"><div class="icon">▦</div><div><small>Insgesamt</small><b id="sTotal">0</b> Bücher</div></div>
    <div class="stat"><div class="icon">✓</div><div><small>Gelesen</small><b id="sRead">0</b></div></div>
    <div class="stat"><div class="icon">📖</div><div><small>Lese gerade</small><b id="sReading">0</b></div></div>
    <div class="stat"><div class="icon">◴</div><div><small>Will lesen</small><b id="sWant">0</b></div></div>
    <div class="stat"><div class="icon">Ⅱ</div><div><small>Pausiert</small><b id="sHold">0</b></div></div>
    <div class="stat"><div class="icon">×</div><div><small>Abgebrochen</small><b id="sDropped">0</b></div></div>
    <div class="stat"><div class="icon">♡</div><div><small>Favoriten</small><b id="sFavs">0</b></div></div>
  </footer>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" id="modalClose" type="button">×</button>
    <div class="modal-content">
      <div id="modalCoverBox"></div>
      <div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-author" id="modalAuthor"></p>

        <label class="modal-label">Deine Sternebewertung</label>
        <div class="modal-stars" id="modalStars"></div>

        <label class="modal-label">Lesefortschritt</label>
        <div class="progress-row">
          <input id="modalCurrentPage" type="number" min="0" placeholder="Aktuelle Seite">
          <input id="modalTotalPages" type="number" min="0" placeholder="Seiten insgesamt">
        </div>

        <label class="modal-label" for="modalReview">Deine Notizen / Bewertung</label>
        <textarea id="modalReview" placeholder="Schreib hier deine Gedanken zum Buch..."></textarea>

        <div class="modal-actions">
          <button type="button" id="modalFavBtn">♡ Favorit</button>
          <select id="modalStatus"></select>
          <button type="button" id="modalDeleteBtn" class="modal-delete">🗑️ Löschen</button>
        </div>

        <p class="modal-hint">Alles wird automatisch gespeichert ✨</p>
      </div>
    </div>
  </div>
</div>

<script>
const statuses = ["All","Want to Read","Reading","Read","On Hold","Dropped","<3 Favs"];
const realStatuses = ["Want to Read","Reading","Read","On Hold","Dropped"];
const icons = {
  "All":"▦",
  "Want to Read":"◴",
  "Reading":"📖",
  "Read":"☑",
  "On Hold":"Ⅱ",
  "Dropped":"⊗",
  "<3 Favs":"♡"
};

let filter = "All";
let books = JSON.parse(localStorage.getItem("bookhub_books_v1")) || [];
books = books.map(book => ({
  author:"",
  pages:0,
  currentPage:0,
  rating:0,
  review:"",
  fav:false,
  ...book
}));

const grid = document.getElementById("grid");
const viewToggle = document.getElementById("viewToggle");
const tabs = document.getElementById("tabs");
const searchInput = document.getElementById("search");
const addBtn = document.getElementById("addBtn");
const bookQuery = document.getElementById("bookQuery");
const bookStatus = document.getElementById("bookStatus");
const bookSearchBtn = document.getElementById("bookSearchBtn");
const bookResults = document.getElementById("bookResults");

const detailModal = document.getElementById("detailModal");
const modalClose = document.getElementById("modalClose");
const modalCoverBox = document.getElementById("modalCoverBox");
const modalTitle = document.getElementById("modalTitle");
const modalAuthor = document.getElementById("modalAuthor");
const modalStars = document.getElementById("modalStars");
const modalCurrentPage = document.getElementById("modalCurrentPage");
const modalTotalPages = document.getElementById("modalTotalPages");
const modalReview = document.getElementById("modalReview");
const modalFavBtn = document.getElementById("modalFavBtn");
const modalStatus = document.getElementById("modalStatus");
const modalDeleteBtn = document.getElementById("modalDeleteBtn");
let activeModalBookId = null;

const coverViews = [
  { key:"large", label:"📖 Große Cover" },
  { key:"medium", label:"🗂️ Mittlere Cover" },
  { key:"compact", label:"🔲 Kleine Cover" }
];

let coverView = localStorage.getItem("bookhub_cover_view") || "large";
if(!coverViews.some(view => view.key === coverView)) coverView = "large";
let bookSearchTimer;
let lastSearchId = 0;

addBtn.addEventListener("click", addBook);
searchInput.addEventListener("input", render);
bookSearchBtn.addEventListener("click", searchBooks);

viewToggle.addEventListener("click", () => {
  const currentIndex = coverViews.findIndex(view => view.key === coverView);
  coverView = coverViews[(currentIndex + 1) % coverViews.length].key;
  localStorage.setItem("bookhub_cover_view", coverView);
  updateCoverView();
});

bookQuery.addEventListener("input", () => {
  clearTimeout(bookSearchTimer);
  const query = bookQuery.value.trim();
  if(query.length < 2){
    bookResults.innerHTML = "";
    return;
  }
  bookSearchTimer = setTimeout(searchBooks, 450);
});

bookQuery.addEventListener("keydown", (event) => {
  if(event.key === "Enter"){
    event.preventDefault();
    clearTimeout(bookSearchTimer);
    searchBooks();
  }
});

modalClose.addEventListener("click", closeModal);
detailModal.addEventListener("click", (event) => {
  if(event.target === detailModal) closeModal();
});

document.addEventListener("keydown", (event) => {
  if(event.key === "Escape" && detailModal.classList.contains("open")) closeModal();
});

modalReview.addEventListener("input", () => {
  const book = findBook(activeModalBookId);
  if(book){
    book.review = modalReview.value;
    saveOnly();
  }
});

modalCurrentPage.addEventListener("input", () => {
  const book = findBook(activeModalBookId);
  if(book){
    book.currentPage = Number(modalCurrentPage.value) || 0;
    saveOnly();
    render();
  }
});

modalTotalPages.addEventListener("input", () => {
  const book = findBook(activeModalBookId);
  if(book){
    book.pages = Number(modalTotalPages.value) || 0;
    saveOnly();
    render();
  }
});

modalFavBtn.addEventListener("click", () => {
  const book = findBook(activeModalBookId);
  if(book){
    book.fav = !book.fav;
    saveOnly();
    updateModal();
    render();
  }
});

modalStatus.addEventListener("change", () => {
  const book = findBook(activeModalBookId);
  if(book){
    book.status = modalStatus.value;
    if(book.status === "Read" && book.pages > 0) book.currentPage = book.pages;
    saveOnly();
    updateModal();
    render();
  }
});

modalDeleteBtn.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  const book = findBook(activeModalBookId);
  if(!book) return;
  if(confirm("Dieses Buch wirklich löschen?")){
    books = books.filter(entry => String(entry.id) !== String(book.id));
    closeModal();
    save();
  }
});

function updateCoverView(){
  coverViews.forEach(view => grid.classList.remove(`view-${view.key}`));
  grid.classList.add(`view-${coverView}`);
  const currentView = coverViews.find(view => view.key === coverView);
  viewToggle.textContent = currentView.label;
}

function save(){
  localStorage.setItem("bookhub_books_v1", JSON.stringify(books));
  render();
}

function saveOnly(){
  localStorage.setItem("bookhub_books_v1", JSON.stringify(books));
}

function addBook(){
  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  const pages = Number(document.getElementById("pages").value) || 0;
  const file = document.getElementById("cover").files[0];
  const status = document.getElementById("status").value;

  if(!title){
    alert("Bitte einen Buchtitel eingeben.");
    return;
  }

  const create = (image) => {
    books.unshift({
      id: Date.now(),
      title,
      author,
      pages,
      currentPage: status === "Read" ? pages : 0,
      image,
      status,
      fav:false,
      rating:0,
      review:""
    });

    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    document.getElementById("pages").value = "";
    document.getElementById("cover").value = "";
    save();
  };

  if(file){
    const reader = new FileReader();
    reader.onload = (event) => create(event.target.result);
    reader.readAsDataURL(file);
  } else {
    create("");
  }
}

async function searchBooks(){
  const query = bookQuery.value.trim();

  if(!query || query.length < 2){
    bookResults.innerHTML = "";
    return;
  }

  bookResults.innerHTML = '<div class="loading">Suche läuft in mehreren Buchkatalogen... 🌸</div>';
  const searchId = ++lastSearchId;

  try{
    // Erst wenige, sehr genaue Anfragen. Nur wenn nötig folgen breitere Suchen.
    const firstWave = await Promise.allSettled([
      searchGoogleBooks(query, false),
      searchOpenLibrary(query, false),
      searchInternetArchive(query)
    ]);

    if(searchId !== lastSearchId) return;

    let merged = firstWave.flatMap(result => result.status === "fulfilled" ? result.value : []);
    let ranked = rankAndDedupeBooks(merged, query);

    // Zweite Suchstufe nur bei wenigen oder schwachen Treffern – verhindert API-Drosselung.
    const hasStrongMatch = ranked.some(book => book.score >= 115);
    if(ranked.length < 10 || !hasStrongMatch){
      const secondWave = await Promise.allSettled([
        searchGoogleBooks(query, true),
        searchOpenLibrary(query, true)
      ]);
      if(searchId !== lastSearchId) return;
      merged.push(...secondWave.flatMap(result => result.status === "fulfilled" ? result.value : []));
      ranked = rankAndDedupeBooks(merged, query);
    }

    const results = ranked.slice(0, 36);
    const fallback = `
      <div class="search-fallback">
        Dein Buch ist nicht dabei? Übernimm „${escapeHTML(query)}“ direkt ins manuelle Formular.
        <br><button type="button" data-action="prefill-manual" data-query="${escapeHTML(query)}">✍️ Manuell ergänzen</button>
      </div>`;

    if(results.length === 0){
      bookResults.innerHTML = fallback;
      return;
    }

    bookResults.innerHTML = results.map(book => `
      <article class="book-result"
        data-title="${escapeHTML(book.title)}"
        data-author="${escapeHTML(book.author)}"
        data-pages="${book.pages || 0}"
        data-image="${escapeHTML(book.image || "")}"
        data-isbn="${escapeHTML(book.isbn || "")}"
        data-language="${escapeHTML(book.language || "")}"
        data-series="${escapeHTML(book.series || "")}">
        ${book.image ? `<img src="${escapeHTML(book.image)}" alt="">` : `<div class="no-cover">Kein Cover</div>`}
        <b>${escapeHTML(book.title)}</b>
        <small>${escapeHTML(book.author || "Unbekannter Autor")} · ${escapeHTML(book.year || "Unbekannt")}</small>
        <div class="book-result-meta">
          <span class="result-chip">${escapeHTML(book.source)}</span>
          ${book.language ? `<span class="result-chip">${escapeHTML(book.language.toUpperCase())}</span>` : ""}
          ${book.series ? `<span class="result-chip">Reihe: ${escapeHTML(book.series)}</span>` : ""}
        </div>
      </article>
    `).join("") + fallback;

  } catch(error){
    console.error(error);
    bookResults.innerHTML = '<div class="empty">Die Online-Suche konnte gerade nicht geladen werden. Versuche es bitte noch einmal oder ergänze das Buch manuell.</div>';
  }
}

function normalizeSearchText(text){
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, " ")
    .trim()
    .replace(/\s+/g, " ");
}

function isISBN(query){
  const isbn = String(query || "").replace(/[^0-9Xx]/g, "");
  return (isbn.length === 10 || isbn.length === 13) ? isbn.toUpperCase() : "";
}

function meaningfulWords(text){
  const stop = new Set(["the","a","an","and","or","of","to","in","on","der","die","das","ein","eine","einer","eines","und","oder","von","am","im","zu"]);
  return normalizeSearchText(text).split(" ").filter(word => word.length > 1 && !stop.has(word));
}

function similarityScore(a, b){
  const aw = meaningfulWords(a);
  const bw = meaningfulWords(b);
  if(!aw.length || !bw.length) return 0;
  const bset = new Set(bw);
  const overlap = aw.filter(word => bset.has(word)).length;
  return overlap / Math.max(aw.length, bw.length);
}

function scoreBookResult(book, query){
  const q = normalizeSearchText(query);
  const title = normalizeSearchText(book.title);
  const author = normalizeSearchText(book.author);
  const isbn = isISBN(query);
  let score = 0;

  if(isbn && String(book.isbn || "").replace(/[^0-9X]/gi, "").includes(isbn)) score += 220;
  if(title === q) score += 180;
  if(title.startsWith(q)) score += 105;
  if(title.includes(q)) score += 85;
  if(author === q) score += 120;
  if(author.includes(q)) score += 75;
  score += Math.round(similarityScore(title, q) * 90);
  score += Math.round(similarityScore(`${title} ${author}`, q) * 35);
  if(book.image) score += 7;
  if(book.pages > 0) score += 3;
  if(book.isbn) score += 3;
  if(book.source === "Google Books") score += 2;
  return score;
}

function rankAndDedupeBooks(items, query){
  const exactISBN = isISBN(query);
  const best = new Map();
  for(const raw of items){
    if(!raw || !raw.title) continue;
    const book = { source:"Buchkatalog", language:"", isbn:"", series:"", ...raw };
    book.score = scoreBookResult(book, query);
    const isbnKey = String(book.isbn || "").replace(/[^0-9X]/gi, "");
    const key = exactISBN && isbnKey ? `isbn:${isbnKey}` : `${normalizeSearchText(book.title)}|${normalizeSearchText(book.author)}`;
    const old = best.get(key);
    if(!old || book.score > old.score || (!old.image && book.image)) best.set(key, book);
  }
  return [...best.values()].sort((a,b) => b.score - a.score);
}

function buildQueryParts(query){
  const cleaned = String(query || "").replace(/[“”„"'’`´:;,.!?()[\]{}\/\\|_+=*&^%$#@~<>]+/g, " ").replace(/\s+/g, " ").trim();
  const words = cleaned.split(" ").filter(Boolean);
  return {
    cleaned,
    short: words.slice(0, 6).join(" "),
    firstHalf: words.slice(0, Math.max(2, Math.ceil(words.length / 2))).join(" "),
    lastHalf: words.slice(Math.max(0, Math.floor(words.length / 2))).join(" ")
  };
}

function bestGoogleCover(info){
  const links = info.imageLinks || {};
  return (links.extraLarge || links.large || links.medium || links.small || links.thumbnail || links.smallThumbnail || "")
    .replace("http://", "https://")
    .replace(/&zoom=\d/, "&zoom=3");
}

function extractSeries(info){
  const categories = Array.isArray(info.categories) ? info.categories : [];
  const subtitle = info.subtitle || "";
  const match = subtitle.match(/(?:Band|Book|Volume|Vol\.?|Teil)\s*([0-9IVX]+)/i);
  return match ? `${match[0]}` : (categories.find(value => /series|reihe/i.test(value)) || "");
}

async function fetchGoogleBooks(searchText, startIndex = 0){
  try{
    const apiUrl = new URL("https://www.googleapis.com/books/v1/volumes");
    apiUrl.searchParams.set("q", searchText);
    apiUrl.searchParams.set("startIndex", String(startIndex));
    apiUrl.searchParams.set("maxResults", "40");
    apiUrl.searchParams.set("orderBy", "relevance");
    apiUrl.searchParams.set("printType", "books");
    apiUrl.searchParams.set("projection", "full");

    const response = await fetch(apiUrl.toString());
    if(!response.ok) return [];
    const data = await response.json();
    return (data.items || []).filter(item => item.volumeInfo?.title).map(item => {
      const info = item.volumeInfo || {};
      const ids = info.industryIdentifiers || [];
      const isbn = ids.find(id => id.type === "ISBN_13")?.identifier || ids.find(id => id.type === "ISBN_10")?.identifier || "";
      return {
        title: info.subtitle ? `${info.title}: ${info.subtitle}` : info.title,
        author: Array.isArray(info.authors) ? info.authors.join(", ") : "Unbekannter Autor",
        year: info.publishedDate ? String(info.publishedDate).slice(0,4) : "Unbekannt",
        pages: Number(info.pageCount) || 0,
        image: bestGoogleCover(info),
        isbn,
        language: info.language || "",
        series: extractSeries(info),
        source: "Google Books"
      };
    });
  } catch(error){ return []; }
}

async function searchGoogleBooks(query, broad = false){
  const isbn = isISBN(query);
  const parts = buildQueryParts(query);
  const searches = isbn
    ? [`isbn:${isbn}`, isbn]
    : broad
      ? [parts.cleaned, `intitle:${parts.short}`, parts.firstHalf, parts.lastHalf]
      : [`intitle:"${parts.cleaned}"`, `"${parts.cleaned}"`];

  const results = [];
  for(const search of [...new Set(searches.filter(Boolean))]){
    const batch = await fetchGoogleBooks(search, 0);
    results.push(...batch);
    if(results.some(book => scoreBookResult(book, query) >= 150)) break;
  }
  if(broad && results.length < 12){
    results.push(...await fetchGoogleBooks(parts.cleaned, 40));
  }
  return results;
}

async function fetchOpenLibrary(params, page = 1){
  try{
    const apiUrl = new URL("https://openlibrary.org/search.json");
    Object.entries(params).forEach(([key,value]) => { if(value) apiUrl.searchParams.set(key, value); });
    apiUrl.searchParams.set("limit", "50");
    apiUrl.searchParams.set("page", String(page));
    apiUrl.searchParams.set("fields", "title,subtitle,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,language,series");
    const response = await fetch(apiUrl.toString());
    if(!response.ok) return [];
    const data = await response.json();
    return (data.docs || []).filter(book => book.title).map(book => ({
      title: book.subtitle ? `${book.title}: ${book.subtitle}` : book.title,
      author: Array.isArray(book.author_name) ? book.author_name.join(", ") : "Unbekannter Autor",
      year: book.first_publish_year ? String(book.first_publish_year) : "Unbekannt",
      pages: Number(book.number_of_pages_median) || 0,
      image: book.cover_i ? `https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg` : "",
      isbn: Array.isArray(book.isbn) ? (book.isbn.find(value => String(value).length === 13) || book.isbn[0] || "") : "",
      language: Array.isArray(book.language) ? (book.language.includes("ger") ? "de" : book.language.includes("eng") ? "en" : book.language[0] || "") : "",
      series: Array.isArray(book.series) ? book.series[0] : (book.series || ""),
      source: "Open Library"
    }));
  } catch(error){ return []; }
}

async function searchOpenLibrary(query, broad = false){
  const isbn = isISBN(query);
  const parts = buildQueryParts(query);
  const searches = isbn
    ? [{isbn}]
    : broad
      ? [{q:parts.cleaned},{title:parts.cleaned},{q:parts.firstHalf},{q:parts.lastHalf}]
      : [{title:parts.cleaned,lang:"de"},{title:parts.cleaned,lang:"en"},{q:`title:("${parts.cleaned}")`}];
  const results = [];
  for(const params of searches){
    results.push(...await fetchOpenLibrary(params, 1));
    if(results.some(book => scoreBookResult(book, query) >= 150)) break;
  }
  if(broad && results.length < 10) results.push(...await fetchOpenLibrary({q:parts.cleaned}, 2));
  return results;
}

function escapeArchiveQuery(text){
  return String(text || "").replace(/[+\-&|!(){}\[\]^"~*?:\\/]/g, " ").replace(/\s+/g, " ").trim();
}

async function searchInternetArchive(query){
  try{
    const cleaned = escapeArchiveQuery(query);
    if(cleaned.length < 2) return [];
    const apiUrl = new URL("https://archive.org/advancedsearch.php");
    apiUrl.searchParams.set("q", `mediatype:texts AND (title:("${cleaned}") OR creator:("${cleaned}"))`);
    ["title","creator","date","year","identifier","language"].forEach(field => apiUrl.searchParams.append("fl[]", field));
    apiUrl.searchParams.set("rows", "30");
    apiUrl.searchParams.set("page", "1");
    apiUrl.searchParams.set("output", "json");
    const response = await fetch(apiUrl.toString());
    if(!response.ok) return [];
    const data = await response.json();
    return ((data.response && data.response.docs) || []).filter(book => book.title).map(book => {
      const title = Array.isArray(book.title) ? book.title[0] : book.title;
      const creator = Array.isArray(book.creator) ? book.creator.join(", ") : (book.creator || "Unbekannter Autor");
      const rawYear = book.year || book.date || "";
      const yearMatch = String(Array.isArray(rawYear) ? rawYear[0] : rawYear).match(/\d{4}/);
      const language = Array.isArray(book.language) ? book.language[0] : (book.language || "");
      return {
        title, author:creator, year:yearMatch ? yearMatch[0] : "Unbekannt", pages:0,
        image:book.identifier ? `https://archive.org/services/img/${encodeURIComponent(book.identifier)}` : "",
        isbn:"", language, series:"", source:"Internet Archive"
      };
    });
  } catch(error){ return []; }
}

function addOnlineBook(card){
  const status = bookStatus.value;
  const pages = Number(card.dataset.pages) || 0;

  books.unshift({
    id: Date.now(),
    title: card.dataset.title,
    author: card.dataset.author || "",
    pages,
    currentPage: status === "Read" ? pages : 0,
    image: card.dataset.image || "",
    isbn: card.dataset.isbn || "",
    language: card.dataset.language || "",
    series: card.dataset.series || "",
    status,
    fav:false,
    rating:0,
    review:""
  });

  bookQuery.value = "";
  bookResults.innerHTML = "";
  save();
}

function openModal(id){
  activeModalBookId = id;
  updateModal();
  detailModal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  detailModal.classList.remove("open");
  document.body.style.overflow = "";
  activeModalBookId = null;
}

function updateModal(){
  const book = findBook(activeModalBookId);
  if(!book) return;

  modalTitle.textContent = book.title;
  modalAuthor.textContent = book.author ? `von ${book.author}` : "Autor/in unbekannt";
  modalCoverBox.innerHTML = book.image
    ? `<img class="modal-cover" src="${book.image}" alt="">`
    : `<div class="modal-placeholder">BookHub</div>`;

  modalStars.innerHTML = [1,2,3,4,5].map(star => `
    <button type="button" data-modal-rating="${star}">
      ${star <= book.rating ? "★" : "☆"}
    </button>
  `).join("");

  modalCurrentPage.value = book.currentPage || "";
  modalTotalPages.value = book.pages || "";
  modalReview.value = book.review || "";
  modalFavBtn.textContent = book.fav ? "❤️ Favorit" : "♡ Favorit";

  modalStatus.innerHTML = realStatuses.map(status => `
    <option value="${status}" ${book.status === status ? "selected" : ""}>
      ${icons[status]} ${status}
    </option>
  `).join("");
}

function count(status){
  if(status === "All") return books.length;
  if(status === "<3 Favs") return books.filter(book => book.fav).length;
  return books.filter(book => book.status === status).length;
}

function renderTabs(){
  tabs.innerHTML = "";
  statuses.forEach(status => {
    const btn = document.createElement("button");
    btn.className = "tab" + (filter === status ? " active" : "");
    btn.type = "button";
    btn.textContent = `${icons[status]} ${status}`;
    btn.addEventListener("click", () => {
      filter = status;
      render();
    });
    tabs.appendChild(btn);
  });
}

function updateStats(){
  document.getElementById("sTotal").textContent = books.length;
  document.getElementById("sRead").textContent = count("Read");
  document.getElementById("sReading").textContent = count("Reading");
  document.getElementById("sWant").textContent = count("Want to Read");
  document.getElementById("sHold").textContent = count("On Hold");
  document.getElementById("sDropped").textContent = count("Dropped");
  document.getElementById("sFavs").textContent = count("<3 Favs");
}

function visibleBooks(){
  const query = searchInput.value.toLowerCase();
  return books
    .filter(book => filter === "All" || (filter === "<3 Favs" ? book.fav : book.status === filter))
    .filter(book => `${book.title} ${book.author}`.toLowerCase().includes(query));
}

function getProgressText(book){
  if(book.status === "Read") return "Gelesen";
  if(book.pages > 0 && book.currentPage > 0){
    const percent = Math.min(100, Math.round((book.currentPage / book.pages) * 100));
    return `${percent}% · S. ${book.currentPage}/${book.pages}`;
  }
  return book.status;
}

function render(){
  renderTabs();
  updateStats();
  grid.innerHTML = "";

  const shown = visibleBooks();
  if(shown.length === 0){
    grid.innerHTML = '<div class="empty">Noch keine Bücher gefunden 🌸</div>';
    return;
  }

  shown.forEach(book => {
    const card = document.createElement("article");
    card.className = "card";

    const cover = book.image
      ? `<img class="cover" src="${book.image}" alt="" data-action="open-modal" data-id="${book.id}">`
      : `<div class="placeholder" data-action="open-modal" data-id="${book.id}">BookHub</div>`;

    card.innerHTML = `
      <div class="progress-badge">${escapeHTML(getProgressText(book))}</div>
      ${cover}
      <div class="info">
        <h2>${escapeHTML(book.title)}</h2>
        <p>${escapeHTML(book.author || "Autor/in unbekannt")}</p>
      </div>
    `;

    grid.appendChild(card);
  });
}

function findBook(id){
  return books.find(book => String(book.id) === String(id));
}

document.addEventListener("click", (event) => {
  const target = event.target;
  const action = target.dataset.action;

  if(target.dataset.action === "prefill-manual"){
    document.getElementById("title").value = target.dataset.query || bookQuery.value.trim();
    document.getElementById("author").focus();
    document.getElementById("title").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  const bookCard = target.closest(".book-result");
  if(bookCard){
    addOnlineBook(bookCard);
    return;
  }

  if(target.dataset.modalRating){
    const book = findBook(activeModalBookId);
    if(book){
      book.rating = Number(target.dataset.modalRating);
      saveOnly();
      updateModal();
      render();
    }
    return;
  }

  if(action === "open-modal"){
    openModal(target.dataset.id);
  }
});

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

updateCoverView();
render();
</script>
